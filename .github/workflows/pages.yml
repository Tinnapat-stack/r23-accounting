# ทดสอบสิทธิ์ฐานข้อมูล แล้วเอาโฟลเดอร์ web ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# ต้องตั้ง Settings → Pages → Source เป็น "GitHub Actions" ครั้งแรกครั้งเดียว
name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # แนบเลขเวอร์ชันท้ายไฟล์โค้ด ให้เบราว์เซอร์โหลดของใหม่ทันทีหลังขึ้นเว็บ ไม่ใช้ไฟล์เก่าที่จำไว้
      - run: |
          v=${GITHUB_SHA::8}
          sed -i "s#src=\"./app.js\"#src=\"./app.js?v=$v\"#" web/index.html
          sed -i "s#from '\./\([a-z]*\)\.js'#from './\1.js?v=$v'#" web/app.js
          grep -q "slipqr.js?v=$v" web/app.js
          grep -q "app.js?v=$v" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
